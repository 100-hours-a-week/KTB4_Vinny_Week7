<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 | 아무 말 대잔치</title>
  <link rel="stylesheet" href="./css/colors.css" />
  <link rel="stylesheet" href="./css/common.css" />
  <link rel="stylesheet" href="./css/auth.css" />
</head>
<body>
  <div class="page">
    <site-header></site-header>

    <main class="main">
      <section class="auth-form" aria-labelledby="login-title">
        <h1 id="login-title" class="section-title">로그인</h1>
        <form id="login-form" class="form form--login" action="/login" method="POST" novalidate>
          <div class="form-group">
            <label class="label" for="email">이메일</label>
            <input class="input" id="email" type="email" name="username"placeholder="이메일을 입력하세요" required />
            <p id="email-helper-text" class="helper"></p>
          </div>
          <div class="form-group">
            <label class="label" for="password">비밀번호</label>
            <input class="input" id="password" type="password" name="password" placeholder="비밀번호를 입력하세요" required />
            <p id="password-helper-text" class="helper"></p>
          </div>
          <button id="login-button" class="btn btn--primary btn--wide btn--rounded" type="submit" disabled>로그인</button>
        </form>
        <a id="sign-up-link" class="link-button" href="./sign-up.html">회원가입</a>
      </section>
    </main>
  </div>
  <script type="module" src="./js/common/header.js"></script>
  <script type="module" src="./js/login.js"></script>
</body>
</html>
