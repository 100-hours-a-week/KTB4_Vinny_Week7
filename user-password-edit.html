<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비밀번호 수정 | CINEON</title>
  <link rel="stylesheet" href="./css/colors.css" />
  <link rel="stylesheet" href="./css/common.css" />
  <link rel="stylesheet" href="./css/user.css" />
</head>

<body>
  <div class="page">
    <site-header show-profile></site-header>

    <main class="main main--settings">
      <div class="settings-layout">
        <aside class="settings-sidebar" aria-label="회원정보 관리 메뉴">
          <div class="settings-profile">
            <span class="settings-profile__avatar" data-settings-avatar aria-hidden="true"></span>
            <div class="settings-profile__text">
              <strong data-settings-nickname>회원</strong>
              <span data-settings-email></span>
            </div>
          </div>
          <nav class="settings-nav">
            <a class="settings-nav__item" href="./user-profile-edit.html">
              <span aria-hidden="true">●</span>회원 정보 수정
            </a>
            <a class="settings-nav__item is-active" href="./user-password-edit.html" aria-current="page">
              <span aria-hidden="true">◆</span>비밀번호 변경
            </a>
          </nav>
          <div class="settings-nav settings-nav--account">
            <button class="settings-nav__item" type="button" data-settings-logout>
              <span aria-hidden="true">↗</span>로그아웃
            </button>
            <a class="settings-nav__item settings-nav__item--danger" href="./user-profile-edit.html?withdraw=1">
              <span aria-hidden="true">×</span>회원 탈퇴
            </a>
          </div>
        </aside>

        <section class="settings-content" aria-labelledby="password-edit-title">
          <header class="settings-content__header">
            <p class="settings-content__eyebrow">SECURITY</p>
            <h1 id="password-edit-title" class="section-title">비밀번호 변경</h1>
            <p>안전한 계정 사용을 위해 새로운 비밀번호를 입력하세요.</p>
          </header>
          <form id="user-password-edit-form" class="form--password-edit settings-form" novalidate>
          <div class="form-group">
            <label class="label" for="password">비밀번호</label>
            <input
              class="input"
              id="password"
              type="password"
              autocomplete="new-password"
              placeholder="비밀번호를 입력하세요"
              required />
            <p id="password-helper-text" class="helper"></p>
          </div>
          <div class="form-group">
            <label class="label" for="password-confirm">비밀번호 확인</label>
            <input
              class="input"
              id="password-confirm"
              type="password"
              autocomplete="new-password"
              placeholder="비밀번호를 한번 더 입력하세요"
              required />
            <p id="confirm-password-helper-text" class="helper"></p>
          </div>
          <button
            id="user-password-edit-button"
            class="btn btn--primary btn--wide btn--square"
            type="submit"
            disabled>비밀번호 변경</button>
          </form>
        </section>
      </div>
    </main>
  </div>
  <div
    id="user-password-edit-toast"
    class="toast"
    role="status"
    aria-live="polite">수정완료</div>

  <script type="module" src="./js/common/header.js"></script>
  <script type="module" src="./js/common/user-settings.js"></script>
  <script type="module" src="./js/user-password-edit.js"></script>
</body>
</html>
