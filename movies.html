<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>영화 목록 | CINEON</title>
  <link rel="stylesheet" href="./css/colors.css" />
  <link rel="stylesheet" href="./css/common.css" />
  <link rel="stylesheet" href="./css/movie.css" />
</head>
<body>
  <div class="page">
    <site-header
      movie-header
      login-link="./login.html"></site-header>

    <main class="main main--movie">
      <div class="movie-home">
        <section
          id="featured-movie"
          class="movie-hero"
          aria-label="추천 영화"></section>

        <section id="popular-movies" class="movie-section" aria-labelledby="popular-movies-title">
          <div class="movie-section__header">
            <h2 id="popular-movies-title" class="movie-section__title">지금 인기 있는 영화</h2>
            <a class="movie-section__more" href="./movies.html?view=all">더보기 〉</a>
          </div>
          <div id="movie-list" class="movie-grid" aria-live="polite"></div>
        </section>
      </div>
    </main>
  </div>
  <script type="module" src="./js/common/header.js"></script>
  <script type="module" src="./js/movies.js"></script>
</body>
</html>
